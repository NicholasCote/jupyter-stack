# Builds this image and pushes it to a container registry.
#
# NOTE: GitHub only reads .github/workflows from a repository ROOT. This file
# does nothing until this directory is the root of its own repo.
#
# This runs on GitHub's own `ubuntu-latest` runners with a local builder, so it
# works in any cloned repo with no NSF NCAR infrastructure access. All you need
# is a registry you can push to.
#
# Before the first run:
#   1. Set REGISTRY and IMAGE below.
#   2. Add two repository secrets (Settings -> Secrets and variables -> Actions):
#        REGISTRY_USERNAME   robot account / username for that registry
#        REGISTRY_PASSWORD   its password or token
#      Without them the image still builds on every push and PR, it just is not
#      pushed anywhere - useful for checking that your environment.yml solves.
#
# Pushing to hub.k8s.ucar.edu (NSF NCAR Harbor) needs a Harbor project you can
# write to - ask CISL. Pushing to this repo's own GitHub Packages instead needs
# no secrets at all:
#   REGISTRY: ghcr.io
#   IMAGE:    ${{ github.repository }}   (i.e. owner/repo, lowercased)
#   add `packages: write` to permissions, and replace the login step's
#   username/password with ${{ github.actor }} / ${{ secrets.GITHUB_TOKEN }}.
#
# On CIRRUS-internal runners? Add back `driver: remote` and
# `endpoint: tcp://buildkitd.arc-systems:1234` on the buildx step and set
# `runs-on: {group: CIRRUS-4x8}` - both require CISL to grant access first.
name: Build and push notebook image

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  # CHANGE ME - registry host, and the image path inside it.
  REGISTRY: hub.k8s.ucar.edu
  IMAGE: your-harbor-project/your-image-name

jobs:
  build:
    runs-on: ubuntu-latest
    # A cold conda solve on a 2-core hosted runner is slow. Raise if you add a
    # large stack (CUDA, TensorFlow, Torch).
    timeout-minutes: 120
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Get short sha
        run: echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      # Hosted runners ship ~25 GB free; a conda notebook image plus its build
      # cache can exceed that. Deleting toolchains this build never uses buys
      # ~20 GB. Safe to drop if your image is small.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      # Do we have credentials? Pull requests never push (a fork PR cannot read
      # secrets anyway), and a clone that has not set the secrets yet builds
      # without pushing rather than failing on an unhelpful login error.
      - name: Decide whether to push
        id: mode
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pull request - building only, not pushing."
          elif [ -n "$REGISTRY_USERNAME" ] && [ -n "$REGISTRY_PASSWORD" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "::warning::REGISTRY_USERNAME / REGISTRY_PASSWORD are not set - building only, not pushing. See the comments at the top of this workflow."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Registry login
        if: steps.mode.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Cache lives in GitHub Actions cache, not the registry, so it also works
      # on runs that cannot log in. The build is single-stage, so mode=min
      # already covers every layer of the final image. Note GitHub's 10 GB
      # per-repo cache limit: a very large image will evict itself between runs.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          load: ${{ steps.mode.outputs.push != 'true' }}
          push: ${{ steps.mode.outputs.push == 'true' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest,${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      # Cheap version of the local smoke tests in the README. On non-pushing runs
      # the image is already in the local daemon; on pushing runs `docker run`
      # pulls the tag that was just pushed, so this tests what actually landed.
      - name: Smoke test the image
        run: |
          IMG='${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ env.SHORT_SHA }}'
          docker run --rm "$IMG" python -c 'import sys; print(sys.version)'
          docker run --rm "$IMG" jupyterhub-singleuser --version
          docker run --rm "$IMG" jupyter kernelspec list
          # As an arbitrary uid, the way the hub runs it.
          docker run --rm --user 54321 "$IMG" python -c 'print("ok as uid 54321")'
