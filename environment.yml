# =============================================================================
# This is the file you edit.
#
# Everything above the "YOUR PACKAGES" marker is what makes this image work as
# a CIRRUS JupyterHub notebook. Add below it; avoid removing from above it.
#
# On pinning: only jupyterhub-singleuser is pinned exactly, because it has to
# match the hub. Do NOT add tight pins for jupyterlab_server, jupyter_server or
# notebook - pinning those alongside jupyterlab is what makes the solve fail.
# Let conda choose them. When you want reproducibility, generate a lock file
# rather than hand-pinning (see README).
#
# The `name:` below is ignored at build time - the Containerfile installs this
# environment by prefix. Renaming it is harmless but has no effect.
# =============================================================================
name: notebook

channels:
  - conda-forge

dependencies:
  # ---- interpreter --------------------------------------------------------
  - python=3.12

  # ---- Jupyter itself -----------------------------------------------------
  - jupyterlab
  - notebook
  - ipykernel
  - ipywidgets

  # ---- Jupyter Integrations -----------------------------------------------
  - jupyter-server-proxy    # proxies extra web apps (dask dashboard, etc.)
  - jupyter-resource-usage  # the CPU/RAM readout in the status bar
  - nbgitpuller             # nbgitpuller links, used by course/workshop material
  - jupyterlab-git          # git panel in the JupyterLab sidebar
  - nbdime                  # readable notebook diffs
  - nb_conda_kernels        # envs in ~/my-conda-envs show up as kernels
  - jupyter-ai>=3          # agents exist only in v3; conda-forge still has 2.x
  - nodejs                  # npm, for the jupyter-ai agents in npm.txt
